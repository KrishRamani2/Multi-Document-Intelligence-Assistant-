[project]
name = "backend"
version = "0.1.0"
description = "Multi-Document Intelligence Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "unstructured",
    "pydantic>=2.0",
    "sentence-transformers",
    "langchain",
    "langchain-community",
    "pypdf",
    "beautifulsoup4",
    "yt-dlp",
    "python-dotenv",
    "qdrant-client",
    "redis",
    "pi-heif>=1.3.0",
    "unstructured-inference>=1.2.0",
    "pdf2image>=1.17.0",
    "markdown>=3.10.2",
    "pdfminer>=20191125",
    "assemblyai",
    "google-genai",
    "pillow",
    "motor>=3.7.1",
    "loguru>=0.7.3",
    "langchain-qdrant>=1.1.0",
    "reportlab",
    "matplotlib",
    "ragas",
    "datasets",
    "langchain-openai",
    "uvicorn>=0.44.0",
    "fastapi>=0.135.3",
]

[dependency-groups]
dev = [
    "pdfminer-six>=20260107",
    "pypdf>=6.10.0",
    "unstructured>=0.18.32",
]
