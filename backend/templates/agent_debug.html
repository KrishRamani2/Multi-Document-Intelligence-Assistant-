<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Agent Debug Console</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ═══════════════════════════════════════════════════════════════════════════
           DESIGN SYSTEM - CSS Variables for consistent theming
           The frontend should use these same variables in their React/styled-components
        ═══════════════════════════════════════════════════════════════════════════ */
        :root {
            --bg-dark: #0d1117;
            --bg-panel: #161b22;
            --bg-input: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --warning: #d29922;
            --error: #f85149;
            --purple: #a371f7;
        }
        
        body {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        
        .layout {
            display: grid;
            grid-template-columns: 350px 1fr 400px;
            grid-template-rows: 60px 1fr 200px;
            height: 100vh;
        }
        
        .header {
            grid-column: 1 / -1;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }
        
        .header h1 { font-size: 18px; color: var(--accent); }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            background: var(--bg-input);
        }
        
        .status-badge.ready { color: var(--success); }
        .status-badge.thinking { color: var(--warning); animation: pulse 1s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .input-panel {
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .input-panel textarea {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 15px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            flex: 1;
        }
        
        .btn-row { display: flex; gap: 10px; }
        
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
        }
        
        .btn-primary { background: var(--accent); color: var(--bg-dark); font-weight: 600; }
        .btn-secondary { background: var(--bg-input); color: var(--text); }
        
        /* Console logging */
        .console {
            background: var(--bg-dark);
            overflow-y: auto;
            padding: 15px;
            font-size: 12px;
        }
        
        .log-entry {
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            border-left: 3px solid var(--border);
            background: var(--bg-panel);
        }
        
        .log-entry.thinking { border-left-color: var(--warning); }
        .log-entry.tool_call { border-left-color: var(--purple); }
        .log-entry.tool_result { border-left-color: var(--accent); }
        .log-entry.chart { border-left-color: var(--success); }
        .log-entry.video { border-left-color: #f778ba; }
        .log-entry.complete { border-left-color: var(--success); background: rgba(63,185,80,0.1); }
        
        .output-panel {
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .output-tabs { display: flex; border-bottom: 1px solid var(--border); }
        
        .output-tab {
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-dim);
            border-bottom: 2px solid transparent;
        }
        
        .output-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .output-content { flex: 1; overflow-y: auto; padding: 15px; }
        
        .output-section { margin-bottom: 20px; }
        .output-section h3 { color: var(--text-dim); font-size: 11px; text-transform: uppercase; margin-bottom: 10px; }
        
        /* Widgets - These are the key UI components the frontend needs to build in React */
        
        /* ──────────────────────────────────────────────────────────────────────────────
           CHART WIDGET - Line/Bar/Pie visualization
           API returns: { chart_type, title, labels[], datasets[], insight }
           Frontend should render with Chart.js or Recharts
        ────────────────────────────────────────────────────────────────────────────── */
        .chart-widget {
            background: var(--bg-input);
            border-radius: 8px;
            padding: 15px;
            height: 280px;
            margin: 10px 0;
        }
        
        .chart-insight {
            color: var(--success);
            font-size: 12px;
            margin-top: 10px;
            padding: 8px;
            background: rgba(63,185,80,0.1);
            border-radius: 4px;
        }
        
        /* ──────────────────────────────────────────────────────────────────────────────
           VIDEO WIDGET - Embedded YouTube with timestamps + transcript
           API returns: { segments[], query, video_info }
           Frontend should render:
           - Video player with embed_url + start_time
           - Transcript segment list with clickable timestamps
           - Hover/tap on transcript jumps to that timestamp
        ────────────────────────────────────────────────────────────────────────────── */
        .video-widget {
            background: var(--bg-input);
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .video-player {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
        }
        
        .video-player iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }
        
        .video-info {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        .video-title { color: var(--text); font-size: 14px; font-weight: 600; }
        
        .video-transcript {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .transcript-segment {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .transcript-segment:hover { background: var(--bg-panel); }
        
        .transcript-timestamp {
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
        }
        
        .transcript-text {
            color: var(--text);
            font-size: 13px;
            margin-top: 4px;
        }
        
        /* ──────────────────────────────────────────────────────────────────────────────
           SOURCE WIDGET - Document sources with scores
           API returns: { sources[] }
        ────────────────────────────────────────────────────────────────────────────── */
        .source-item {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        .source-name { color: var(--accent); font-size: 13px; }
        .source-score { color: var(--success); font-size: 11px; }
        .source-preview { color: var(--text-dim); font-size: 12px; margin-top: 6px; }
        
        /* Quick action buttons */
        .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .quick-btn {
            padding: 6px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text-dim);
            font-size: 11px;
            cursor: pointer;
        }
        .quick-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <!-- ═══════════════════════════════════════════════════════════════════════════
         MAIN LAYOUT - 3 column grid
         +------------------------------------------+
         |  Header (status + docs count)           |
         +------------------------------------------+
         | Input  |  Console    |  Output         |
         | Panel  |  (logs)     |  Panel         |
         |        |            |  (widget tabs) |
         +------------------------------------------+
    ═══════════════════════════════════════════════════════════════════════════ -->
    <div class="layout">
        <header class="header">
            <h1>🤖 Agent Debug Console</h1>
            <span class="status-badge ready" id="statusBadge">Ready</span>
            <span style="margin-left: auto; color: var(--text-dim); font-size: 12px;">
                Documents: <span id="docCount">4</span> | Chunks: <span id="chunkCount">21</span>
            </span>
        </header>
        
        <!-- Input Panel -->
        <div class="input-panel">
            <textarea id="query" placeholder="Ask anything...">What is this video about union budget?</textarea>
            
            <!-- Quick action buttons for testing -->
            <div class="quick-actions">
                <button class="quick-btn" onclick="setQuery('show revenue chart')">📊 Chart</button>
                <button class="quick-btn" onclick="setQuery('compare regional revenue')">🌍 Regional</button>
                <button class="quick-btn" onclick="setQuery('What is this video about?')">🎥 Video</button>
                <button class="quick-btn" onclick="setQuery('what is the revenue?')">💰 Revenue</button>
            </div>
            
            <div class="btn-row">
                <button class="btn btn-primary" onclick="submit()">▶ Run Agent</button>
                <button class="btn btn-secondary" onclick="clearConsole()">Clear</button>
            </div>
        </div>
        
        <!-- Console - Shows internal agent events -->
        <div class="console" id="console">
            <div class="log-entry">
                <span class="log-type">info</span>
                <div class="log-data">Ready. Try a query above.</div>
            </div>
        </div>
        
        <!-- Output Panel with widget tabs -->
        <div class="output-panel">
            <div class="output-tabs">
                <!-- Widget tab buttons - Click to switch between Answer/Charts/Video/Sources -->
                <div class="output-tab active" data-tab="answer" onclick="showTab('answer')">Answer</div>
                <div class="output-tab" data-tab="charts" onclick="showTab('charts')">Charts</div>
                <div class="output-tab" data-tab="video" onclick="showTab('video')">Video</div>
                <div class="output-tab" data-tab="sources" onclick="showTab('sources')">Sources</div>
            </div>
            
            <div class="output-content" id="outputContent">
                <!-- Widget containers - populated dynamically -->
                <div class="output-section" id="answerSection">
                    <div class="answer-text" id="answerText">Run the agent to see results...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ═══════════════════════════════════════════════════════════════════════════
           STREAMING API INTEGRATION
           
           Endpoint: POST /agent/stream
           Request: { query: string, stream: boolean }
           
           Response: Server-Sent Events (SSE) with streaming JSON
           Format: 'data: {"type": "eventType", "data": {...}}\n\n'
           
           Event types:
           - thinking: { message: "Analyzing query..." }
           - tool_call: { tool: "youtube_search", input: {...} }
           - tool_result: { tool: "youtube_search", output: {...} }
           - chart: { charts: [...] }  ← Chart.js config
           - video: { segments: [...], video_info: {...} }  ← YouTube segments
           - complete: { answer: "...", sources: [...], charts: [...], video: {...} }
        ═══════════════════════════════════════════════════════════════════════════ */
        
        let eventSource = null;
        
        /* State for different widget data */
        let currentCharts = [];
        let currentVideo = null;
        let currentSources = [];
        
        /* ──────────────────────────────────────────────────────────────────────
           CHART.JS RENDERING
           The API returns Chart.js-compatible config:
           {
               chart_type: "line" | "bar" | "doughnut",
               title: "Revenue Trend",
               labels: ["Q1", "Q2", "Q3", "Q4"],
               datasets: [{
                   label: "Revenue ($M)",
                   data: [26, 28, 32, 39],
                   backgroundColor: ["#2563eb", ...],
                   borderColor: "#2563eb",
                   fill: true,
                   tension: 0.3
               }],
               insight: "Revenue grew 50%..."
           }
           Frontend should create chart with: new Chart(ctx, { type, data, options })
        ────────────────────────────────────────────────────────────────────── */
        
        /* ──────────────────────────────────────────────────────────────────────
           YOUTUBE WIDGET RENDERING
           The API returns video segments:
           {
               segments: [{
                   video_id: "jcOeLrxHSXg",
                   title: "Segment at 00:12",
                   url: "https://youtube.com/watch?v=...",
                   embed_url: "https://www.youtube.com/embed/...?start=12",
                   start_time: 12,
                   end_time: 30,
                   transcript: "In this video about budget...",
                   thumbnail: "https://img.youtube.com/..."
               }],
               query: "union budget",
               video_info: { video_id, thumbnail, total_segments }
           }
           
           Frontend should render:
           1. Embedded YouTube player at embed_url
           2. List of transcript segments with timestamps
           3. Click segment → seek to start_time
        ────────────────────────────────────────────────────────────────────── */
        
        function setQuery(q) {
            document.getElementById('query').value = q;
        }
        
        function showTab(tab) {
            document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            const content = document.getElementById('outputContent');
            
            if (tab === 'answer') {
                content.innerHTML = `<div class="output-section"><div class="answer-text" id="answerText">${currentAnswer || 'No answer yet'}</div></div>`;
            } else if (tab === 'charts' && currentCharts.length) {
                renderChartsWidget(content);
            } else if (tab === 'video' && currentVideo) {
                renderVideoWidget(content);
            } else if (tab === 'sources' && currentSources.length) {
                renderSourcesWidget(content);
            } else {
                content.innerHTML = '<div class="output-section"><div class="answer-text">No data for this widget</div></div>';
            }
        }
        
        function renderChartsWidget(container) {
            let html = '<div class="output-section"><h3>Visualizations</h3></div>';
            
            currentCharts.forEach((chart, i) => {
                html += `
                    <div class="chart-widget">
                        <canvas id="chart${i}"></canvas>
                        ${chart.insight ? `<div class="chart-insight">💡 ${chart.insight}</div>` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Render Chart.js instances after DOM is updated
            currentCharts.forEach((chart, i) => {
                const ctx = document.getElementById(`chart${i}`).getContext('2d');
                new Chart(ctx, {
                    type: chart.chart_type === 'doughnut' ? 'pie' : (chart.chart_type || 'bar'),
                    data: {
                        labels: chart.labels || ['Q1','Q2','Q3','Q4'],
                        datasets: chart.datasets || [{
                            data: [26,28,32,39],
                            backgroundColor: ['#2563eb','#7c3aed','#059669','#dc2626']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: chart.title, color: '#c9d1d9' },
                            legend: { position: 'bottom', labels: { color: '#c9d1d9' } }
                        }
                    }
                });
            });
        }
        
        function renderVideoWidget(container) {
            const v = currentVideo;
            const seg = v.segments[0] || {};
            
            container.innerHTML = `
                <div class="output-section"><h3>Video</h3></div>
                <div class="video-widget">
                    <div class="video-player">
                        <iframe src="${seg.embed_url || ''}" allowfullscreen></iframe>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${seg.transcript?.slice(0, 100) || 'YouTube Video'}</div>
                    </div>
                    <div class="video-transcript">
                        ${v.segments.map(s => `
                            <div class="transcript-segment" onclick="seekTo(${s.start_time})">
                                <div class="transcript-timestamp">${formatTime(s.start_time)}</div>
                                <div class="transcript-text">${s.transcript}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function seekTo(seconds) {
            // Frontend: Update iframe src with new start time
            console.log('Seek to:', seconds);
        }
        
        function renderSourcesWidget(container) {
            let html = '<div class="output-section"><h3>Sources</h3></div>';
            
            currentSources.forEach(s => {
                html += `
                    <div class="source-item">
                        <div class="source-name">${s.document_name}</div>
                        <div class="source-score">Score: ${(s.score || 0).toFixed(2)}</div>
                        <div class="source-preview">${(s.text_preview || '').slice(0, 150)}...</div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
        
        function log(type, data) {
            const console = document.getElementById('console');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const time = new Date().toLocaleTimeString();
            const dataStr = typeof data === 'object' ? JSON.stringify(data, null, 2).slice(0, 500) : data;
            
            entry.innerHTML = `
                <span class="log-time">${time}</span>
                <span class="log-type">${type}</span>
                <div class="log-data">${dataStr}</div>
            `;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }
        
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            document.getElementById('answerText').textContent = 'Run the agent to see results...';
        }
        
        /* ═══════════════════════════════════════════════════════════════════════════
           MAIN SUBMIT FUNCTION
           1. Shows thinking status
           2. Calls /agent/stream with SSE
           3. Parses SSE events and updates widgets
           4. Final 'complete' event has all data
        ═══════════════════════════════════════════════════════════════════════════ */
        
        let currentAnswer = '';
        
        async function submit() {
            const query = document.getElementById('query').value;
            if (!query) return;
            
            document.getElementById('statusBadge').className = 'status-badge thinking';
            document.getElementById('statusBadge').textContent = 'Thinking...';
            
            log('user', query);
            currentAnswer = '';
            currentCharts = [];
            currentVideo = null;
            currentSources = [];
            
            try {
                const response = await fetch('/agent/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, stream: true })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const text = decoder.decode(value);
                    const lines = text.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data.trim()) {
                                try {
                                    const event = JSON.parse(data);
                                    handleEvent(event);
                                } catch(e) {}
                            }
                        }
                    }
                }
            } catch(e) {
                log('error', e.message);
            }
            
            document.getElementById('statusBadge').className = 'status-badge ready';
            document.getElementById('statusBadge').textContent = 'Ready';
        }
        
        /* ═══════════════════════════════════════════════════════════════════
           EVENT HANDLER
           Routes events to appropriate widgets
        ═══════════════════════════════════════════════════════════════════════════ */
        
        function handleEvent(event) {
            const { type, data } = event;
            
            log(type, data);
            
            if (type === 'thinking') {
                document.getElementById('statusBadge').textContent = data.message || 'Thinking...';
            }
            
            if (type === 'tool_call') {
                // Frontend: Show which tool is being called
            }
            
            if (type === 'chart') {
                // Store chart data for Charts tab
                currentCharts = data.charts || [];
            }
            
            if (type === 'video') {
                // Store video data for Video tab
                currentVideo = data;
            }
            
            if (type === 'complete') {
                currentAnswer = data.answer || '';
                currentCharts = currentCharts.length ? currentCharts : (data.charts || []);
                currentVideo = currentVideo || data.video;
                currentSources = data.sources || [];
                
                // Update answer display immediately
                document.getElementById('answerText').textContent = currentAnswer;
                
                // Auto-switch to relevant tab
                if (currentVideo && currentVideo.segments?.length) {
                    showTab('video');
                } else if (currentCharts.length) {
                    showTab('charts');
                }
            }
        }
    </script>
</body>
</html>
